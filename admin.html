<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
    body { font-family: 'Inter', sans-serif; background: #FAFAFA; padding: 2rem; }
    .dashboard { max-width: 1200px; margin: 0 auto; }
    .card { background: white; padding: 2rem; border-radius: 12px; border: 1px solid #EAEAEA; margin-bottom: 2rem; }
    h1 { margin-top: 0; font-weight: 900; letter-spacing: -1px; }
    
    /* Table Styles */
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 1rem; border-bottom: 1px solid #EAEAEA; }
    th { background: #f5f5f5; font-weight: 700; }
    
    /* Aggregation Grid */
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
    .summary-item { padding: 1rem; background: #111; color: white; border-radius: 8px; font-weight: 700; }
    
    select { padding: 0.5rem; font-family: 'Inter', sans-serif; }
  </style>
</head>
<body>

  <div class="dashboard">
    <h1>ADMIN DASHBOARD</h1>

    <div class="card">
      <h2>PRODUCTION SUMMARY</h2>
      <div id="production-summary" class="summary-grid">
        <!-- AI auto-counts will appear here -->
      </div>
    </div>

    <div class="card">
      <h2>ALL ORDERS</h2>
      <table>
        <thead>
          <tr>
            <th>Customer</th>
            <th>Email</th>
            <th>Items Ordered</th>
            <th>DP Proof</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="orders-table">
          <!-- Order rows will be injected here -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // 1. SUPABASE SETUP
    const supabaseUrl = 'YOUR_SUPABASE_URL';
    const supabaseKey = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    async function loadAdminData() {
      const { data: orders, error } = await supabase.from('orders').select('*');
      if (error) {
        console.error(error);
        return;
      }

      let totals = {};
      const tableBody = document.getElementById('orders-table');

      orders.forEach(order => {
        // Render Table Row
        let itemsHtml = '';
        for (const [itemId, qty] of Object.entries(order.items)) {
          itemsHtml += `${itemId} (x${qty})<br>`;
          // Aggregate Production Totals
          if (!totals[itemId]) totals[itemId] = 0;
          totals[itemId] += qty;
        }

        // Get image URL
        const { data: imgData } = supabase.storage.from('payment_proofs').getPublicUrl(order.proof_url);

        tableBody.innerHTML += `
          <tr>
            <td>${order.customer_name}</td>
            <td>${order.customer_email}</td>
            <td>${itemsHtml}</td>
            <td><a href="${imgData.publicUrl}" target="_blank">View Proof</a></td>
            <td>
              <select onchange="updateStatus('${order.id}', this.value)">
                <option value="${order.status}" selected disabled>${order.status}</option>
                <option value="Verification Pending">Verification Pending</option>
                <option value="In Production">In Production</option>
                <option value="Ready for Pelunasan">Ready for Pelunasan</option>
              </select>
            </td>
          </tr>
        `;
      });

      // Render Production Summary Grid
      const summaryDiv = document.getElementById('production-summary');
      for (const [itemId, count] of Object.entries(totals)) {
        summaryDiv.innerHTML += `<div class="summary-item">${itemId}: ${count} total</div>`;
      }
    }

    async function updateStatus(orderId, newStatus) {
      const { error } = await supabase
        .from('orders')
        .update({ status: newStatus })
        .eq('id', orderId);
      
      if (!error) alert('Status updated successfully!');
    }

    // Load data on page start
    loadAdminData();
  </script>
</body>
</html>
