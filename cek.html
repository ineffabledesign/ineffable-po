<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cek Order – Ineffable Design</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--ink:#0a1a2b;--lcd:#46d6ff;--navy:#07131f;--line:#6f7b88}
*{box-sizing:border-box}
body{margin:0;font-family:Quicksand,sans-serif;color:var(--ink);background:linear-gradient(#a9ccf2,#e6f1fc 55%,#fff) fixed;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;opacity:.3;background:conic-gradient(#fff 25%,transparent 0 50%,#fff 0 75%,transparent 0) 0 0/28px 28px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.win{border:2px solid var(--line);border-radius:14px;background:linear-gradient(#fff,#e3e8ee);box-shadow:0 5px 0 rgba(60,90,130,.18);overflow:hidden;margin-bottom:14px}
.bar{display:flex;align-items:center;gap:6px;padding:5px 10px;background:linear-gradient(#cfe3f8,#9fc3ec);border-bottom:2px solid var(--line);font:20px VT323,monospace;color:#1d3550}
.bar i{width:11px;height:11px;border-radius:50%;background:linear-gradient(#fff,#aab4bf);border:1.5px solid var(--line)}
.bar span{margin-left:auto}
.body{padding:14px;display:grid;gap:10px}
label{display:grid;gap:3px;font-weight:700;font-size:14px}
input{font:16px Quicksand,sans-serif;padding:10px;border:2px solid var(--line);border-radius:10px;background:#fff}
.btn{font:22px VT323,monospace;padding:5px 18px;border:2px solid var(--line);border-radius:999px;background:linear-gradient(#e8fbff,#7fd6f5);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #8d98a5;text-decoration:none;text-align:center;display:inline-block}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8d98a5}
.btn:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #2b8fd6;outline-offset:2px}
h1{margin:6px 0 10px;font:clamp(36px,9vw,54px)/1 VT323,monospace;color:#8f99a4;text-shadow:0 2px 0 #fff,0 -1px 0 #6f7b88;text-align:center}
.lcd{background:var(--navy);color:var(--lcd);font:24px VT323,monospace;padding:12px 14px;text-shadow:0 0 8px rgba(70,214,255,.7)}
.steps{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.steps li{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px solid #c3cfdc;border-radius:10px;background:#fff;font-weight:700;font-size:14px;color:#8a99ab}
.steps li::before{content:"□";font:22px VT323,monospace}
.steps li.done{color:var(--ink);border-color:var(--line)}.steps li.done::before{content:"■";color:#2b8fd6}
.steps li.now{background:var(--navy);color:var(--lcd);border-color:var(--navy);text-shadow:0 0 6px rgba(70,214,255,.7)}.steps li.now::before{content:"▶"}
.sum{font-size:14px;border:2px dashed #9db4cc;border-radius:10px;padding:8px 10px;background:#fff}
.sum div{display:flex;justify-content:space-between;gap:10px}
.note{font-size:13px;color:#52667c;margin:0}
a.back{display:block;text-align:center;color:#1f6fa8;font-weight:700;margin-top:8px}
.oc{display:grid;gap:10px;padding-bottom:14px;border-bottom:2px dashed #9db4cc}.oc:last-child{border:0;padding-bottom:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>CEK ORDER</h1>
  <section class="win">
    <div class="bar"><i></i><i></i><i></i><span>cek_order.exe</span></div>
    <div class="body">
      <label>Email yang kamu pakai buat order<input id="email" type="email" autocomplete="email"></label>
      <button class="btn" id="go">Cek status</button>
      <p class="note" id="msg" role="status"></p>
    </div>
  </section>
  <section class="win" id="res" hidden>
    <div class="bar"><i></i><i></i><i></i><span>status.exe</span></div>
    <div class="body" id="resBody"></div>
  </section>
  <a class="back" href="index.html">← Balik ke pre-order</a>
</div>
<script>
// ===== Isi nanti setelah Supabase jadi. Kosong = mode demo =====
const SB_URL="",SB_KEY="";
// ===============================================================
const DEMO=!SB_URL,sb=DEMO?null:supabase.createClient(SB_URL,SB_KEY);
const ST=[["pending","Menunggu dicek"],["dp_masuk","Pembayaran masuk"],["confirmed","Order dikonfirmasi"],["cek_shopee","Cek Shopee"],["done","Selesai"]];
const $=id=>document.getElementById(id),rp=n=>"Rp "+Number(n).toLocaleString("id-ID");
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https:\/\//i.test(u||"")?u:"";
const demo=[
 {id:12,status:"cek_shopee",items:[{name:"Produk Contoh 1",qty:2,price:25000},{name:"Produk Contoh 3",qty:1,price:45000}],total:95000,nominal_bayar:50000},
 {id:15,status:"pending",items:[{name:"Produk Contoh 2",qty:1,price:35000}],total:35000,nominal_bayar:35000}];
async function find(email){
  if(DEMO)return email.toLowerCase()==="demo@mail.com"?demo:[];
  const {data,error}=await sb.rpc("cek_order",{p_email:email});
  if(error)throw error;return data||[];
}
$("go").onclick=async()=>{
  const email=$("email").value.trim();$("res").hidden=true;
  if(!/\S+@\S+\.\S+/.test(email)){$("msg").textContent="Isi email yang kamu pakai buat order dulu ya.";return}
  $("msg").textContent="Mencari…";
  try{
    const list=await find(email);
    if(!list.length){$("msg").textContent="Belum ada order dengan email itu. Cek lagi penulisannya, ya.";return}
    $("msg").textContent=DEMO?"Mode demo. Coba: demo@mail.com":"";
    $("resBody").innerHTML=list.map(card).join("");$("res").hidden=false;
  }catch(e){$("msg").textContent="Lagi ada masalah. Coba lagi sebentar lagi."}
};
function card(o){
  const i=Math.max(0,ST.findIndex(s=>s[0]===o.status)),sisa=Math.max(0,o.total-o.nominal_bayar);
  return `<div class="oc"><div class="lcd">Order #${esc(o.id)} · ${ST[i][1]}</div>
  <ol class="steps">${ST.map((s,k)=>`<li class="${k<i||o.status==="done"&&k<=i?"done":k===i?"now":""}">${s[1]}</li>`).join("")}</ol>
  <div class="sum">${(o.items||[]).map(x=>`<div><span>${esc(x.name)} ×${Number(x.qty)}</span><span>${rp(x.price*x.qty)}</span></div>`).join("")}
  <div><b>Total</b><b>${rp(o.total)}</b></div><div><span>Sudah dibayar</span><span>${rp(o.nominal_bayar)}</span></div><div><span>Sisa</span><span>${rp(sisa)}</span></div></div>
  ${o.status==="cek_shopee"?'<p class="note">Lanjut cek Shopee-mu ya, pelunasan dilakukan di sana.</p>':""}</div>`;
}
</script>
</body>
</html>
